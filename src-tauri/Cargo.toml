[package]
name = "glass-notes-desktop"
version = "0.1.9"
description = "Glass Notes personal cocktail library"
license = "MIT"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tempfile = "3"
rfd = "0.15"
open = "5"
tauri-plugin-single-instance = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
